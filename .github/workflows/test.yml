name: tests

on:
  # A push to main, and every pull request: a branch with a pull request is tested once, not twice
  push:
    branches: [main]
  pull_request:
  # The workflow that publishes to npm runs the same tests first
  workflow_call:

jobs:
  # A change that only touches documentation does not need the eight systems: the checks of the texts are enough.
  # Anything that is not a push or a pull request (the release that publishes to npm) always runs everything.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if [ "$EVENT" = push ] || [ "$EVENT" = pull_request ]; then
            if files=$(git diff --name-only "$BASE" HEAD 2>/dev/null) && [ -n "$files" ]; then
              echo "$files"
              if ! echo "$files" | grep -v -E '^(docs/.*|.*\.md|llms(-full)?\.txt|LICENSE)$' | grep -q .; then
                code=false
              fi
            fi
          fi
          echo "Run the whole matrix: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # Only documentation changed: the tests of the texts (links, anchors, files for agents, what is said about npm)
  docs:
    needs: scope
    if: needs.scope.outputs.code == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm run check

      - run: node --test tests/release.test.js

  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }} / python ${{ matrix.python }}
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest and the newest Python that are supported, on the oldest and the newest Node.js
          - { os: ubuntu-latest, node: 20, python: '3.9' }
          - { os: ubuntu-latest, node: 24, python: '3.14' }
          # The versions in between
          - { os: ubuntu-latest, node: 24, python: '3.10' }
          - { os: ubuntu-latest, node: 24, python: '3.11' }
          - { os: ubuntu-latest, node: 24, python: '3.12' }
          - { os: ubuntu-latest, node: 22, python: '3.13' }
          # The other platforms
          - { os: macos-latest, node: 24, python: '3.12' }
          - { os: windows-latest, node: 24, python: '3.12' }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # The tests of the Total.js integration need the framework. The published package is enough
      # (the MCP checks are skipped when it does not include the MCP router).
      - run: npm install --no-save total5

      - name: Install NumPy
        run: python -m pip install "numpy>=1.23,<3"

      # The crate of the Rust workers. The runners already have the stable toolchain.
      - run: cargo test --manifest-path rust/Cargo.toml

      # The module of the Go workers. The tests below build the Go worker of the tests with the same toolchain.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - run: go vet ./...
        working-directory: go

      - run: go test ./...
        working-directory: go

      # Builds the Rust and Go workers of the tests and runs everything. The log is kept to find out what failed.
      - name: npm test
        env:
          TOTALFUSION_TEST_NUMPY: python
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log

      - name: What failed
        if: failure()
        shell: bash
        run: |
          echo "=== tests that failed ==="
          grep -n -E "^\s*(✖|not ok)|failing tests|^ℹ (tests|pass|fail|cancelled|skipped)|^# (tests|pass|fail|cancelled|skipped)" test.log | head -80 || true
          echo "=== the first error messages ==="
          grep -n -E "AssertionError|Error \[|Error:|ENOENT|EACCES|timed out" test.log | head -40 || true
          echo "=== the assertion that failed (message, expected, actual) ==="
          grep -n -B14 -A22 -E "name: 'AssertionError'" test.log | head -120 || true
          echo "=== what the workers said before they stopped (the lines after the error) ==="
          grep -n -A6 -E "worker stopped during the call" test.log | head -60 || true

      - name: Keep the log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-${{ matrix.os }}-node${{ matrix.node }}-python${{ matrix.python }}
          path: test.log
