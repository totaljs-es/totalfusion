name: Idea
description: Something that TotalFusion could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem first, before the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: A sketch of the code that you would like to write.
      render: js
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today?
