<script total>

	exports.id = 'fusionstats';
	exports.name = 'Stats';
	exports.icon = 'ti ti-chart-bar';
	exports.author = 'TotalFusion';
	exports.version = '2';
	exports.group = 'TotalFusion';
	exports.config = { interval: 0 };
	exports.inputs = [{ id: 'input', name: 'Read' }];
	exports.outputs = [{ id: 'output', name: 'Stats' }];

	// The logic is in total5/flow.js: it uses the same pool of workers as the rest of the application
	exports.make = require('totalfusion').flow('stats');

</script>

<readme>
Sends what the pools of workers are doing (workers, calls, queue, recycled workers, memory of each worker) when a message arrives, and every N seconds if you set it. It is `fusion.stats()`, one entry for each runtime that has started.
</readme>

<settings>
	<div class="padding">
		<ui-component name="input" path="?.interval" config="type:number;monospace:1" class="m">Send every (seconds, 0 = only when a message arrives)</ui-component>
	</div>
</settings>

<style>
	.CLASS ui-bind { padding: 10px; font-size: 12px; border-top: 1px solid rgba(0,0,0,0.1); }

	</ui-bind>
